# Alembic configuration — SevenLab PDF Chat (T-003).
#
# The database URL is NOT stored here. `alembic/env.py` resolves it from
# `POSTGRESQL_URI` (env var or backend/.env via app.config), so one
# `.env` drives both the FastAPI process and the migration CLI.
#
# Run from backend/:
#     alembic upgrade head          # apply all migrations
#     alembic current               # show the applied revision
#     alembic check                 # fail if models drift from the migrations
#     alembic revision --autogenerate -m "describe change"

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40
version_path_separator = os

# Placeholder — overridden at runtime by env.py from POSTGRESQL_URI.
sqlalchemy.url = postgresql+psycopg://user:pass@localhost/placeholder

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
